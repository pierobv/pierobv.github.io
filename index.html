<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piero Volpato</title>
    <meta
      name="description"
      content="Piero Volpato, software developer focused on AI engineering. Projects with measured, documented decisions."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preview card when the link is shared (LinkedIn, WhatsApp, Slack, X...).
         og:image must be an absolute URL: the crawlers don't resolve relative paths. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://pierobv.github.io/" />
    <meta property="og:title" content="Piero Volpato — Full-stack Engineer" />
    <meta
      property="og:description"
      content="Full-stack engineer (C#/.NET, Python, React) doing an MSc in AI & Cybersecurity. Projects with measured, documented decisions."
    />
    <meta property="og:image" content="https://pierobv.github.io/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--
      Applies the theme before React loads, so the page never flashes light before turning dark.
      Dark (the torch) is the default for everyone; light only if the visitor picked it before.
    -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('theme');
        } catch (e) {}
        if (theme !== 'light') theme = 'dark';
        document.documentElement.dataset.theme = theme;
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
